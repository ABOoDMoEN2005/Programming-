<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المستأجرين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f0;--card:#fff;--ink:#16282b;--mute:#5d7074;--brand:#0f5c63;--on-brand:#fff;--line:#d5dddd;--late:#b3261e;--late-bg:#fbe9e7;--soon:#8a5300;--soon-bg:#fff3d9;--ok:#2e7d4f;--ok-bg:#e4f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1d;--card:#162528;--ink:#e6efef;--mute:#98adb0;--brand:#59b6bd;--on-brand:#06292c;--line:#294044;--late:#ff8a80;--late-bg:#3a1f1d;--soon:#ffc266;--soon-bg:#3a2d12;--ok:#7fd1a0;--ok-bg:#16301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b1d;--card:#162528;--ink:#e6efef;--mute:#98adb0;--brand:#59b6bd;--on-brand:#06292c;--line:#294044;--late:#ff8a80;--late-bg:#3a1f1d;--soon:#ffc266;--soon-bg:#3a2d12;--ok:#7fd1a0;--ok-bg:#16301f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sum b{display:block;font-size:22px;font-weight:800}
.sum span{color:var(--mute);font-size:14px}
.sum .bad b{color:var(--late)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;min-height:44px}
button.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
button.danger{color:var(--late)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.alert{background:var(--soon-bg);color:var(--soon);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;border-inline-start:6px solid var(--ok)}
.item.late{border-inline-start-color:var(--late)}
.item.soon{border-inline-start-color:var(--soon)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:19px;font-weight:700;margin:0}
.unit{color:var(--mute);font-size:15px}
.tag{font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;white-space:nowrap}
.tag.late{background:var(--late-bg);color:var(--late)}
.tag.soon{background:var(--soon-bg);color:var(--soon)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.rows{margin:10px 0;display:grid;gap:4px;font-size:15px}
.rows div{display:flex;justify-content:space-between;gap:10px}
.rows span:first-child{color:var(--mute)}
.owed{color:var(--late);font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap}
a.btn{font:inherit;display:inline-flex;align-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;min-height:44px;text-decoration:none}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
#rbody h2{text-align:center;margin:0 0 8px;font-size:24px}
.stbl{width:100%;border-collapse:collapse;font-size:14px}
.stbl th,.stbl td{border:1px solid var(--line);padding:6px;text-align:right}
.stbl th{background:var(--bg)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;border-inline-start:6px solid var(--brand)}
.rsign{display:flex;justify-content:space-between;margin-top:36px;text-align:center}
@media print{.wrap,dialog:not(#rdlg){display:none!important}body{background:#fff}#rdlg{position:static;width:100%;max-width:none;border:2px solid #000;color:#000;background:#fff}#rdlg *{color:#000!important;border-color:#000!important}.noprint{display:none!important}}
.empty{text-align:center;color:var(--mute);padding:40px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:16px;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:500;font-size:15px}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{font-size:14px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>إدارة المستأجرين</h1>
  <p class="sub">شقق وحواصل: العقود، مواعيد الدفع، والمتأخرات</p>

  <div class="unit" id="syncst" style="margin:-8px 0 12px"></div>
  <div class="sum" id="sum"></div>
  <div id="alerts"></div>

  <div class="bar">
    <button class="pri" id="add">إضافة مستأجر</button>
    <button id="notif">تفعيل التنبيهات</button>
    <button id="lockbtn">القفل</button>
    <button id="rep">تقرير</button>
    <button id="xl">تصدير Excel</button>
    <button id="exp">نسخة احتياطية</button>
    <button id="imp">استرجاع نسخة</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>

  <div class="bar" id="tabs"></div>
  <div id="flt" style="display:grid;gap:8px;margin-bottom:12px">
    <input id="q" type="search" placeholder="بحث بالاسم أو الوحدة أو الجوال">
    <div class="two"><select id="fl"><option value="all">الكل</option><option value="late">المتأخرين فقط</option><option value="soon">بحاجة متابعة (متأخر أو قريب)</option><option value="ok">المنتظمين</option><option value="end">عقود تنتهي قريبًا</option><option value="apt">الشقق فقط</option><option value="shop">الحواصل فقط</option></select><select id="fp"></select></div>
  </div>
  <div id="list"></div>
</div>

<div id="lock" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))">
 <div style="width:min(380px,100%);display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px">
  <b style="font-size:22px">إدارة المستأجرين</b><div class="sub" style="margin:0">أدخل كلمة السر للمتابعة</div>
  <input id="lpw" type="password" autocomplete="current-password" placeholder="كلمة السر">
  <div id="lerr" class="owed" style="min-height:22px"></div>
  <button class="pri" id="lgo">فتح</button>
  <button id="lforget">نسيت كلمة السر</button>
 </div>
</div>
<dialog id="ldlg"><div style="padding:16px;display:grid;gap:10px"><b style="font-size:19px">قفل التطبيق</b><div class="sub" id="lst" style="margin:0"></div>
<label id="lcw" style="display:none">كلمة السر الحالية<input id="lcur" type="password" autocomplete="current-password"></label>
<label>كلمة سر جديدة (4 أحرف أو أكثر)<input id="lnew" type="password" autocomplete="new-password"></label>
<label>تأكيد كلمة السر<input id="lnew2" type="password" autocomplete="new-password"></label>
<div class="alert" id="lmsg" style="display:none"></div>
<div class="acts"><button class="pri" id="lsave">حفظ</button><button id="lnow" style="display:none">قفل الآن</button><button class="danger" id="lremove" style="display:none">إزالة القفل</button><button id="lclose">إغلاق</button></div></div></dialog>
<dialog id="dlg">
  <form id="f">
    <b id="ft" style="font-size:19px">مستأجر جديد</b>
    <label>الوحدة المسجلة (اختياري)<select name="uid"></select></label>
    <label>الاسم<input name="name" required></label>
    <div class="two">
      <label>النوع<select name="type"><option>شقة</option><option>حاصل</option></select></label>
      <label>رقم/اسم الوحدة<input name="unit" placeholder="مثال: شقة 3 / حاصل أ"></label>
    </div>
    <label>رقم الجوال<input name="phone" type="tel" inputmode="tel"></label>
    <div class="two">
      <label>مبلغ الإيجار<input name="rent" type="number" min="0" step="any" required></label>
      <label>العملة<select name="cur"><option>₪</option><option>$</option><option>دينار</option></select></label>
    </div>
    <label>الدفع كل<select name="cycle"><option value="1">شهر</option><option value="2">شهرين</option><option value="3">3 شهور</option><option value="6">6 شهور</option><option value="12">سنة</option></select></label>
    <div class="two">
      <label>بداية العقد<input name="start" type="date"></label>
      <label>نهاية العقد<input name="end" type="date" required></label>
    </div>
    <label>موعد استحقاق الدفعة (إذا لسا ما دفعها، اكتب تاريخها أو اليوم)<input name="due" type="date" required></label>
    <div class="two"><label>الزيادة السنوية<select name="incType"><option value="">بدون زيادة</option><option value="pct">نسبة %</option><option value="amt">مبلغ ثابت</option></select></label><label>قيمة الزيادة<input name="incVal" type="number" min="0" step="any"></label></div>
    <label>تاريخ أول زيادة (إذا تركته فاضي: بعد سنة من بداية العقد)<input name="incDate" type="date"></label>
    <div class="two"><label>غرامة التأخير<select name="lfType"><option value="">بدون</option><option value="day">مبلغ عن كل يوم تأخير</option><option value="pct">نسبة % من الدفعة (مرة وحدة)</option></select></label><label>قيمة الغرامة<input name="lfVal" type="number" min="0" step="any"></label></div>
    <div class="two"><label>مهلة السماح (أيام)<input name="lfGrace" type="number" min="0" step="1"></label><label>حد أقصى للغرامة (اختياري)<input name="lfCap" type="number" min="0" step="any"></label></div>
    <div class="two"><label>مبلغ التأمين<input name="deposit" type="number" min="0" step="any"></label><label>رقم الهوية<input name="idno" inputmode="numeric"></label></div>
    <label>الكفيل (اسم وجوال)<input name="guar"></label>
    <label>تفاصيل الوحدة<input name="details" placeholder="طابق، مساحة، عداد كهرباء..."></label>
    <label>ملاحظات<textarea name="notes" rows="2"></textarea></label>
    <div class="acts">
      <button type="submit" class="pri">حفظ</button>
      <button type="button" id="cancel">إلغاء</button>
    </div>
  </form>
</dialog>
<dialog id="pdlg"><form id="pf"><b id="pt" style="font-size:19px"></b><div class="sub" id="phint" style="margin:0"></div>
<div class="two"><label>المبلغ المستلم<input name="amount" type="number" min="0" step="any" required></label><label>التاريخ<input name="date" type="date" required></label></div>
<label>طريقة الدفع<select name="method"><option>نقدًا</option><option>تحويل بنكي</option><option>محفظة</option><option>شيك</option></select></label>
<label id="pwv" style="display:none;align-items:center;gap:8px"><input type="checkbox" name="waive" style="width:auto;min-height:auto">إعفاء من غرامة التأخير لهذه الدفعة</label>
<label>ملاحظة<input name="note" placeholder="مثال: دفعة جزئية، الباقي الأسبوع القادم"></label>
<div class="acts"><button type="submit" class="pri">حفظ الدفعة</button><button type="button" id="pcancel">إلغاء</button></div></form></dialog>
<dialog id="xdlg"><form id="xf"><b style="font-size:19px">مصروف جديد</b>
<div class="two"><label>التاريخ<input name="xdate" type="date" required></label><label>المبلغ<input name="xamt" type="number" min="0" step="any" required></label></div>
<div class="two"><label>العملة<select name="xcur"><option>₪</option><option>$</option><option>دينار</option></select></label><label>النوع<select name="xcat"><option>صيانة</option><option>تنظيف</option><option>ضرائب ورسوم</option><option>أجور عمال</option><option>أخرى</option></select></label></div>
<label>العقار<select name="xpid"></select></label>
<label>تفاصيل<input name="xdesc" placeholder="مثال: تصليح مواسير الدور الثاني"></label>
<div class="acts"><button type="submit" class="pri">حفظ المصروف</button><button type="button" id="xcancel">إلغاء</button></div></form></dialog>
<dialog id="adlg"><div style="padding:16px;display:grid;gap:10px"><b id="at" style="font-size:19px"></b>
<div id="alist"></div>
<div class="two"><label>نوع المرفق<select id="atype"><option>عقد</option><option>هوية</option><option>أخرى</option></select></label><label>الملف (صورة أو PDF)<input id="afile" type="file" accept="image/*,application/pdf" multiple></label></div>
<div class="alert" id="amsg" style="display:none"></div>
<div class="unit">المرفقات بتنرفع لتخزين الصفحة، ولو شاركت رابط الصفحة مع حدا ممكن يوصلها. لا تشارك الرابط إذا فيها هويات.</div>
<div class="acts"><button id="aclose">إغلاق</button></div></div></dialog>
<dialog id="qdlg"><div style="padding:16px;display:grid;gap:12px"><div id="qmsg"></div><div class="acts"><button class="pri" id="qyes">تأكيد</button><button id="qno">إلغاء</button></div></div></dialog>
<dialog id="rnd"><form id="rnf"><b id="rnt" style="font-size:19px"></b><div class="sub" id="rnh" style="margin:0"></div>
<div class="two"><label>بداية العقد الجديد<input name="from" type="date" required></label><label>نهاية العقد الجديد<input name="nend" type="date" required></label></div>
<label>الإيجار الجديد (من بداية العقد الجديد)<input name="nrent" type="number" min="0" step="any" required></label>
<div class="acts"><button type="submit" class="pri">تجديد العقد</button><button type="button" id="rncancel">إلغاء</button></div></form></dialog>
<dialog id="vcd"><form id="vcf"><b id="vct" style="font-size:19px"></b><div class="sub" id="vch" style="margin:0"></div>
<div class="two"><label>تاريخ الإخلاء<input name="vdate" type="date" required></label><label>خصومات (صيانة/أضرار)<input name="ded" type="number" min="0" step="any"></label></div>
<div class="alert" id="vres"></div>
<label>ملاحظة<input name="vnote"></label>
<div class="acts"><button type="submit" class="pri">تأكيد الإخلاء</button><button type="button" id="vcancel">إلغاء</button></div></form></dialog>
<dialog id="prd"><form id="prf"><b style="font-size:19px">عقار ووحدات</b>
<label>اسم العقار<input name="pname" list="plist" required><datalist id="plist"></datalist></label>
<div class="two"><label>نوع الوحدات<select name="ptype"><option>شقة</option><option>حاصل</option></select></label><label>العملة<select name="pcur"><option>₪</option><option>$</option><option>دينار</option></select></label></div>
<label>الوحدات (كل وحدة بسطر: الاسم، الإيجار المتوقع)<textarea name="plines" rows="6" placeholder="شقة 1، 400&#10;شقة 2، 450" required></textarea></label>
<div class="acts"><button type="submit" class="pri">حفظ</button><button type="button" id="prcancel">إلغاء</button></div></form></dialog>
<dialog id="rdlg"><div id="rc" style="padding:16px;display:grid;gap:10px"><div id="rbody"></div><input id="rname" class="noprint" placeholder="اسم المستلم (بيظهر تحت التوقيع)"><div class="acts noprint"><button class="pri" id="rprint">طباعة</button><button id="rclose">إغلاق</button></div></div></dialog>

<script>
var KEY='tenants_v1',REMIND=7,CONTRACT_WARN=30;
var T=[];var editId=null;
try{T=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){T=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}touch()}
var P=[];try{P=JSON.parse(localStorage.getItem('props_v1')||'[]')}catch(e){P=[]}
function saveP(){try{localStorage.setItem('props_v1',JSON.stringify(P))}catch(e){}touch()}
function bk(){return JSON.stringify({T:T,P:P,X:X})}
function act(){return T.filter(function(t){return !t.archived})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function days(a,b){return Math.round((a-b)/864e5)}
function addM(s,n){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function fmt(s){return parse(s).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}
function money(n){return Number(n).toLocaleString('en-US')}

function rentAt(t,ds){
  var r=+t.rent||0,id=t.incDate;
  (t.rh||[]).forEach(function(s){if(s.from<=ds){r=+s.rent;id=s.incDate}});
  if(!t.incType||!+t.incVal||!id||ds<id)return r;
  var a=parse(id),b=parse(ds);
  var k=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  if(b.getDate()<a.getDate())k--;
  k=Math.floor(k/12)+1;
  var v=+t.incVal;
  return t.incType==='pct'?Math.round(r*Math.pow(1+v/100,k)*100)/100:r+k*v;
}
function curRent(t){return rentAt(t,t.due)}
function feeFor(t,ds,asOf){
  if(!t.lfType||!+t.lfVal)return 0;
  var late=days(asOf,parse(ds))-(+t.lfGrace||0);
  if(late<=0)return 0;
  var v=+t.lfVal,f=t.lfType==='day'?v*late:rentAt(t,ds)*v/100;
  if(+t.lfCap&&f>+t.lfCap)f=+t.lfCap;
  return Math.round(f*100)/100;
}
function calc(t){
  var td=today(),n=0,d=t.due,first=t.due;
  var sum=0,fees=0;while(parse(d)<=td&&n<240){n++;var fe=feeFor(t,d,td);fees+=fe;sum+=rentAt(t,d)+fe;d=addM(d,+t.cycle)}
  var dueIn=days(parse(t.due),td);
  var cEnd=days(parse(t.end),td);
  var owed=n>0?Math.max(0,Math.round((sum-(t.credit||0))*100)/100):0;
  return{cycles:n,owed:owed,fees:n>0?Math.round(fees*100)/100:0,dueIn:dueIn,cEnd:cEnd,next:d};
}
function status(t){
  var c=calc(t);
  if(c.cycles>0&&c.dueIn<0)return{k:'late',txt:'متأخر '+(-c.dueIn)+' يوم',c:c};
  if(c.dueIn===0)return{k:'soon',txt:'الدفع اليوم',c:c};
  if(c.dueIn>0&&c.dueIn<=REMIND)return{k:'soon',txt:'الدفع بعد '+c.dueIn+' يوم',c:c};
  return{k:'ok',txt:'الدفعة بعد '+c.dueIn+' يوم',c:c};
}
function contractTxt(c){
  if(c.cEnd<0)return'منتهي منذ '+(-c.cEnd)+' يوم';
  if(c.cEnd===0)return'ينتهي اليوم';
  return'باقي '+c.cEnd+' يوم';
}

function waLink(t,c){
  var p=(t.phone||'').replace(/\D/g,'');if(!p)return'';
  if(p.indexOf('00')===0)p=p.slice(2);else if(p.charAt(0)==='0')p='970'+p.slice(1);
  var m='السلام عليكم '+t.name+'، تذكير بخصوص إيجار '+t.type+' '+t.unit+': ';
  m+=c.cycles>0?'المبلغ المطلوب '+money(c.owed)+' '+t.cur+'.':'موعد الدفعة القادمة '+fmt(t.due)+' بمبلغ '+money(curRent(t))+' '+t.cur+'.';
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(m);

    h=ar.length?ar.map(function(t){var v=t.vac,r=v.refund;return '<div class="item"><p class="name">'+esc(t.name)+'</p><div class="unit">'+esc(t.type)+' '+esc(t.unit)+'</div><div class="rows"><div><span>تاريخ الإخلاء</span><span>'+fmt(v.date)+'</span></div>'+(v.deposit?'<div><span>التأمين</span><span>'+money(v.deposit)+' '+esc(t.cur)+'</span></div>':'')+(v.owed?'<div><span>متأخرات وقت الإخلاء</span><span class="owed">'+money(v.owed)+' '+esc(t.cur)+'</span></div>':'')+(v.ded?'<div><span>خصومات</span><span>'+money(v.ded)+' '+esc(t.cur)+'</span></div>':'')+'<div><span>'+(r>=0?'المسترد للمستأجر':'باقي على المستأجر')+'</span><span>'+money(Math.abs(r))+' '+esc(t.cur)+'</span></div></div><div class="acts"><button data-a="stm" data-id="'+t.id+'">كشف حساب</button><button data-a="restore" data-id="'+t.id+'">استعادة</button><button class="danger" data-a="del" data-id="'+t.id+'">حذف</button></div></div>'}).join(''):'<div class="empty">الأرشيف فاضي.</div>';
  }else{
    var occ={};act().forEach(function(t){if(t.uid)occ[t.uid]=t});
    h='<div class="acts" style="margin-bottom:12px"><button class="pri" data-a="padd">إضافة عقار أو وحدات</button></div>';
    h+=P.length?P.map(function(p){return '<div class="item"><div class="top"><p class="name">'+esc(p.name)+'</p><button class="danger" data-a="pdel" data-pid="'+esc(p.id)+'">حذف العقار</button></div><div class="rows">'+p.units.map(function(u){var o=occ[u.id];return '<div><span>'+esc(u.label)+(+u.rent?' ('+money(u.rent)+' '+esc(u.cur)+')':'')+'</span><span>'+(o?esc(o.name):'<b class="owed">شاغرة</b>')+' <button data-a="udel" data-uid="'+esc(u.id)+'" style="min-height:28px;padding:0 8px">حذف</button></span></div>'}).join('')+'</div></div>'}).join(''):'<div class="empty">ما في عقارات مسجلة. أضف عمارتك ووحداتها لتتابع الشاغر والمشغول.</div>';
  }
  list.innerHTML=h;
}

prf.addEventListener('submit',function(e){

function render(){
  var list=document.getElementById('list');
  var items=act().map(function(t){return{t:t,s:status(t)}});
  var rank={late:0,soon:1,ok:2};
  items.sort(function(a,b){return rank[a.s.k]-rank[b.s.k]||a.s.c.dueIn-b.s.c.dueIn});
  var grp={},gord=[];
  items.forEach(function(x){var k=gkey(x.t);if(!grp[k]){grp[k]=[];gord.push(k)}grp[k].push(x)});
  items=[].concat.apply([],gord.map(function(k){return grp[k]}));
  var owedBy={},late=0,soon=0,ending=0,msgs=[];
  items.forEach(function(x){
    var t=x.t,c=x.s.c;
    if(x.s.k==='late'){late++;owedBy[t.cur]=(owedBy[t.cur]||0)+c.owed;msgs.push(t.name+' ('+t.unit+'): متأخر '+(-c.dueIn)+' يوم، المطلوب '+money(c.owed)+' '+t.cur)}
    else if(x.s.k==='soon'){soon++;msgs.push(t.name+' ('+t.unit+'): '+x.s.txt+'، '+money(curRent(t))+' '+t.cur)}
    if(c.cEnd<=CONTRACT_WARN){ending++;msgs.push(t.name+' ('+t.unit+'): العقد '+contractTxt(c))}
  });
  var owedTxt=Object.keys(owedBy).map(function(k){return money(owedBy[k])+' '+k}).join(' + ')||'0';
  document.getElementById('sum').innerHTML=
    '<div><b>'+new Set(act().map(gkey)).size+'</b><span>مستأجر ('+act().length+' وحدة)</span></div>'+
    '<div class="'+(late?'bad':'')+'"><b>'+late+'</b><span>متأخر عن الدفع</span></div>'+
    '<div class="'+(late?'bad':'')+'"><b>'+esc(owedTxt)+'</b><span>إجمالي المتأخرات</span></div>'+
    '<div><b>'+ending+'</b><span>عقد ينتهي قريبًا أو منتهي</span></div>';
  document.getElementById('alerts').innerHTML=msgs.length?'<div class="alert">'+msgs.map(esc).join('<br>')+'</div>':'';
  document.title=(late+soon?'('+(late+soon)+') ':'')+'إدارة المستأجرين';
  renderTabs();syncFilters();
  if(V!=='t'){renderOther(list);return}
  items=items.filter(matchF);
  if(items.length===0&&act().length){list.innerHTML='<div class="empty">ما في نتائج مطابقة للبحث أو الفلتر.</div>';return}
  if(!act().length){list.innerHTML='<div class="empty">ما في مستأجرين بعد. اضغط «إضافة مستأجر» للبداية.</div>';return}
  var cards=items.map(function(x){
    var t=x.t,c=x.s.c,paid=(t.log||[]).map(function(p,i){return{p:p,i:i}}).slice(-5).reverse();
    return '<div class="item '+x.s.k+'">'+
    '<div class="top"><div><p class="name">'+esc(t.name)+'</p><div class="unit">'+esc(t.type)+' '+esc(t.unit)+(t.phone?' · '+esc(t.phone):'')+'</div></div><span class="tag '+x.s.k+'">'+x.s.txt+'</span></div>'+
    '<div class="rows">'+
      '<div><span>الإيجار</span><span>'+money(curRent(t))+' '+esc(t.cur)+' كل '+(t.cycle==1?'شهر':t.cycle==12?'سنة':t.cycle+' شهور')+'</span></div>'+
      '<div><span>الدفعة القادمة</span><span>'+fmt(t.due)+'</span></div>'+
      (c.cycles>0?'<div><span>المطلوب الآن ('+c.cycles+' دفعة)</span><span class="owed">'+money(c.owed)+' '+esc(t.cur)+'</span></div>':'')+
      '<div><span>نهاية العقد</span><span>'+fmt(t.end)+' ('+contractTxt(c)+')</span></div>'+
      (t.credit>0?'<div><span>مدفوع جزئيًا من الدفعة</span><span>'+money(t.credit)+' '+esc(t.cur)+'</span></div>':'')+
      (c.fees>0?'<div><span>منها غرامة تأخير</span><span class="owed">'+money(c.fees)+' '+esc(t.cur)+'</span></div>':'')+
      (t.incType&&+t.incVal?'<div><span>الزيادة السنوية</span><span>'+esc(t.incVal)+(t.incType==='pct'?'%':' '+esc(t.cur))+' ابتداءً من '+fmt(t.incDate)+'</span></div>':'')+
      (t.rn&&t.rn.length?'<div><span>التجديدات</span><span>'+t.rn.length+' (آخرها '+fmt(t.rn[t.rn.length-1].date)+')</span></div>':'')+
      (t.deposit?'<div><span>التأمين</span><span>'+money(t.deposit)+' '+esc(t.cur)+'</span></div>':'')+
      (t.idno?'<div><span>الهوية</span><span>'+esc(t.idno)+'</span></div>':'')+
      (t.guar?'<div><span>الكفيل</span><span>'+esc(t.guar)+'</span></div>':'')+
      (t.details?'<div><span>تفاصيل الوحدة</span><span>'+esc(t.details)+'</span></div>':'')+
      (t.notes?'<div><span>ملاحظات</span><span>'+esc(t.notes)+'</span></div>':'')+
    '</div>'+
    '<div class="acts"><button class="pri" data-a="pay" data-id="'+t.id+'">تسجيل دفعة</button>'+(waLink(t,c)?'<a class="btn" target="_blank" rel="noopener" href="'+waLink(t,c)+'">تذكير واتساب</a>':'')+'<a class="btn" target="_blank" rel="noopener" href="'+calLink(t)+'">أضف للتقويم</a>'+(AS?'<button data-a="att" data-id="'+t.id+'">المرفقات'+(t.att&&t.att.length?' ('+t.att.length+')':'')+'</button>':'')+'<button data-a="renew" data-id="'+t.id+'">تجديد العقد</button><button data-a="vac" data-id="'+t.id+'">إخلاء</button><button data-a="addunit" data-id="'+t.id+'">إضافة وحدة</button><button data-a="stm" data-id="'+t.id+'">كشف حساب</button><button data-a="edit" data-id="'+t.id+'">تعديل</button><button class="danger" data-a="del" data-id="'+t.id+'">حذف</button></div>'+
    (paid.length?'<div class="log">آخر الدفعات: '+'<br>'+paid.map(function(q){var p=q.p;return fmt(p.date)+' ('+money(p.amount)+(p.method?' '+esc(p.method):'')+(p.note?' - '+esc(p.note):'')+') <button data-a="rcp" data-id="'+t.id+'" data-i="'+q.i+'" style="min-height:32px;padding:2px 10px">إيصال</button> <button data-a="pedit" data-id="'+t.id+'" data-i="'+q.i+'" style="min-height:32px;padding:2px 10px">تعديل</button> <button class="danger" data-a="pdelx" data-id="'+t.id+'" data-i="'+q.i+'" style="min-height:32px;padding:2px 10px">حذف</button>'}).join('<br>')+'</div>':'')+
    '</div>';
  });
  list.innerHTML=cards.map(function(h,i){return groupHead(items,i)+h}).join('');
}

document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='gstm'){openGroupStatement(b.dataset.key);return}
  if(b.dataset.a==='rentu'){openForm(null);f.elements.uid.value=b.dataset.uid;applyUnit();return}
  if(b.dataset.a==='padd'){openProps();return}
  if(b.dataset.a==='xadd'){openExp();return}
  if(b.dataset.a==='xdel'){ask('حذف المصروف؟',function(){X=X.filter(function(x){return x.id!==b.dataset.xid});saveX();render()});return}
  if(b.dataset.a==='udel'){ask('حذف الوحدة من السجل؟ (ما بتأثر على المستأجرين)',function(){P.forEach(function(p){p.units=p.units.filter(function(u){return u.id!==b.dataset.uid})});saveP();render()});return}
  if(b.dataset.a==='pdel'){ask('حذف العقار وكل وحداته من السجل؟',function(){P=P.filter(function(p){return p.id!==b.dataset.pid});saveP();render()});return}
  var t=T.filter(function(x){return x.id===b.dataset.id})[0];if(!t)return;
  if(b.dataset.a==='pay'){openPay(t)}
  else if(b.dataset.a==='rcp'){openReceipt(t,+b.dataset.i)}
  else if(b.dataset.a==='pedit'){openPayEdit(t,+b.dataset.i)}
  else if(b.dataset.a==='pdelx'){delPay(t,+b.dataset.i)}
  else if(b.dataset.a==='stm'){openStatement(t)}
  else if(b.dataset.a==='addunit'){openUnit(t)}
  else if(b.dataset.a==='edit'){openForm(t)}
  else if(b.dataset.a==='att'){openAtt(t)}
  else if(b.dataset.a==='renew'){openRenew(t)}
  else if(b.dataset.a==='vac'){openVac(t)}
  else if(b.dataset.a==='restore'){t.archived=false;delete t.vac;save();render()}
  else if(b.dataset.a==='del'){ask('حذف '+t.name+' نهائيًا؟',function(){(t.att||[]).forEach(function(a){if(AS)AS.delete(a.id).catch(function(){})});T=T.filter(function(x){return x.id!==t.id});save();render()})}
});

document.getElementById('notif').onclick=function(){
  var msg='إشعارات المتصفح ما اشتغلت هون (غالبًا الصفحة مفتوحة داخل إطار أو المتصفح بمنعها). استخدم زر «أضف للتقويم» على كل مستأجر لتصلك تنبيهات حتى لو الصفحة مسكرة.';
  if(!('Notification' in window)){alert(msg);return}
  try{Notification.requestPermission().then(function(p){if(p==='granted'){notify(true)}else{alert(msg)}}).catch(function(){alert(msg)})}catch(e){alert(msg)}
};
function notify(force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var n=act().filter(function(t){var k=status(t).k;return k!=='ok'}).length;
  if(n){try{new Notification('إدارة المستأجرين',{body:'عندك '+n+' مستأجر عليهم دفعة أو متأخرات'})}catch(e){}}
  else if(force){try{new Notification('إدارة المستأجرين',{body:'كل شيء منتظم'})}catch(e){}}
}

  };r.readAsText(fl);
};
